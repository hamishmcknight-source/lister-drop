*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
  font: var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-ref-typeface-plain);
  letter-spacing: var(--md-sys-typescale-body-medium-tracking); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
::selection { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
:focus-visible { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
/* links: primary + underlined (M3); .quiet = tertiary for less prominent links */
a { color: var(--md-sys-color-primary); text-decoration: underline; text-decoration-thickness: from-font; text-underline-offset: .15em; }
a.quiet { color: var(--md-sys-color-tertiary); }
a:is(.btn, .ibtn, .fab, .chip, .li, .card, .item, .tab, .mi) { text-decoration: none; }
/* running text: 40–60 characters per line */
.hs-prose, .card p, .dialog p, .dialog > .body { max-inline-size: 60ch; }

/* ---------- Material Symbols (load per page with an icon_names subset; GRAD axis -25..0) ----------
   Variables: --ms-fill 0|1 (selected = 1), --ms-wght 400 everywhere, --ms-grad 0 light / -25 dark,
   --ms-opsz = rendered size (20–48). */
.ms { --ms-fill: 0; --ms-wght: 400; --ms-grad: 0; --ms-opsz: 24;
  font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr;
  width: 1em; max-width: 1em; overflow: hidden; flex: 0 0 auto; -webkit-font-smoothing: antialiased; user-select: none;
  font-variation-settings: "FILL" var(--ms-fill), "wght" var(--ms-wght), "GRAD" var(--ms-grad), "opsz" var(--ms-opsz);
  transition: font-variation-settings var(--hs-fx), rotate var(--hs-fast); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ms { --ms-grad: -25; } }
:root[data-theme="dark"] .ms { --ms-grad: -25; }
.ms.fill, [aria-current="page"] .ms, [aria-pressed="true"] > .ms, [aria-selected="true"] .ms, [aria-checked="true"] > .ms { --ms-fill: 1; }
.ms.s20 { font-size: 20px; --ms-opsz: 20; } .ms.s40 { font-size: 40px; --ms-opsz: 40; } .ms.s48 { font-size: 48px; --ms-opsz: 48; }
.ms.inline { font-size: 1em; --ms-opsz: 20; vertical-align: -0.115em; }   /* icon inside running text */
.mono, .num { font-family: var(--hs-typeface-mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--md-sys-color-on-surface-variant); }
.hs-tt { position: absolute; left: 50%; top: 50%; width: max(100%, var(--hs-target)); height: max(100%, var(--hs-target)); translate: -50% -50%; }   /* explicit 48 hit area */

.t-body-m { font: var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font); letter-spacing: var(--md-sys-typescale-body-medium-tracking); }

/* eyebrow: small mono label in sentence case (M3: no caps blocks). .t-label-mono is the same style. */
.t-eyebrow, .t-label-mono { font: 500 0.75rem/1rem var(--hs-typeface-mono); letter-spacing: .02em; text-transform: none; color: var(--md-sys-color-on-surface-variant); }

/* =====================================================================
   4. LAYOUT
   Breakpoints: compact <600 · medium 600–839 · expanded 840–1199 · large 1200–1599 · extra-large ≥1600
   ===================================================================== */
.hs-page { padding-inline: var(--hs-margin); padding-block: var(--hs-space-4) var(--hs-space-7); max-width: 1440px; margin-inline: auto; width: 100%; }
@media (min-width: 1600px) { .hs-page { max-width: 1600px; } }
.hs-stack { display: grid; gap: var(--hs-space-4); align-content: start; min-width: 0; }
.hs-row { display: flex; flex-wrap: wrap; gap: var(--hs-space-2); align-items: center; }   /* ≥ 8 between targets */
.hs-feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min, 280px)), 1fr)); gap: var(--hs-space-2); }   /* M3: ≤ 8 between cards */
/* canonical: list–detail (.hs-ld) and supporting pane (.hs-sp); fixed pane 360 → 412 at large+ */
.hs-ld, .hs-sp { display: grid; gap: var(--hs-spacer); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 840px) {
  .hs-ld { grid-template-columns: var(--hs-pane) minmax(0, 1fr); }
  .hs-sp { grid-template-columns: minmax(0, 1fr) var(--hs-pane); }
}
/* third pane (side sheet ≤ 400) only at extra-large */
.hs-side { width: min(var(--hs-side), 100%); }
@media (min-width: 1600px) { .hs-ld.three { grid-template-columns: var(--hs-pane) minmax(0, 1fr) min(var(--hs-side), 30vw); } }
/* list–detail behaviours: back only in one pane; selection only in two panes; empty placeholder */
@media (min-width: 840px) { .hs-ld .back { display: none; } }
@media (max-width: 839px) { .hs-ld .li[aria-selected="true"] { background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); } }
.hs-ld .empty { display: grid; place-items: center; min-height: 240px; text-align: center; color: var(--md-sys-color-on-surface-variant); }
/* split pane: two flexible panes, spacer centred (low-density content at medium) */
.hs-split { display: grid; gap: var(--hs-spacer); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .hs-split.two { grid-template-columns: 1fr 1fr; } }
@media (min-width: 840px) { .hs-split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
/* preview frame: clips and contains fixed-position children (toolbars, FAB menu, snackbars in specimens) */
.hs-frame { position: relative; contain: layout paint; overflow: clip; min-height: var(--h, 240px); border-radius: var(--md-sys-shape-corner-large);
  background: var(--md-sys-color-surface); box-shadow: inset 0 0 0 1px var(--md-sys-color-outline-variant); }

/* ---------- app shell: nav bar < 600 · collapsed rail 600–1199 · expanded rail ≥ 1200 ----------
   Set data-rail="collapsed" on .hs-shell (menu button) to keep the 96 rail at large+. */
.hs-shell { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.hs-shell > main { min-width: 0; padding-bottom: calc(var(--hs-nav-bar) + env(safe-area-inset-bottom, 0px)); }
.hs-nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; min-height: calc(var(--hs-nav-bar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: space-around; align-items: center;
  background: var(--md-sys-color-surface-container); }   /* same role at every width (M3) */
.hs-nav .item { position: relative; flex: 1 1 0; min-width: 0; min-height: var(--hs-target); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;
  border: 0; background: none; color: var(--md-sys-color-on-surface-variant); cursor: pointer; text-decoration: none;
  font: var(--md-sys-typescale-label-medium-weight) var(--md-sys-typescale-label-medium-size)/var(--md-sys-typescale-label-medium-line-height) var(--md-ref-typeface-plain); }
.hs-nav .item:focus-visible { outline-offset: -3px; }

.hs-nav .item .ic::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; background: var(--md-sys-color-secondary-container);
  transform: scaleX(0); opacity: 0; transition: transform var(--hs-fast), opacity var(--hs-fx); }
.hs-nav .item .ic::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; z-index: -1; pointer-events: none; transition: opacity var(--hs-fx); }
.hs-nav .item:focus-visible .ic::after, .hs-nav .item:active .ic::after { opacity: var(--md-sys-state-focus-state-layer-opacity); }
.hs-nav .item[aria-current="page"] { color: var(--md-sys-color-secondary); font-weight: var(--md-sys-typescale-label-medium-weight-emphasized); }
.hs-nav .item[aria-current="page"] .ic { color: var(--md-sys-color-on-secondary-container); }
.hs-nav .item[aria-current="page"] .ic::before { transform: scaleX(1); opacity: 1; }
.hs-nav .lb { max-width: 100%; min-width: min-content; text-align: center; }   /* never truncate nav labels: wrap between words; a long single word may overhang evenly */
/* badges on nav icons and icon buttons (anchored to the icon's top-trailing corner) */
.hs-nav .ic > .badge { position: absolute; top: 2px; inset-inline-start: 28px; }
.hs-nav .ic > .badge.dot { top: 4px; inset-inline-start: 34px; }
.hs-nav .rail-top { display: grid; justify-items: center; gap: 4px; margin-bottom: 40px; }
@media (max-width: 599px) { .hs-nav .rail-top { display: none; } }
@media (hover: hover) and (pointer: fine) {
  .hs-nav .item:hover .ic::after { opacity: var(--md-sys-state-hover-state-layer-opacity); }
}
@media (min-width: 600px) {
  .hs-shell { grid-template-columns: var(--hs-nav-rail) minmax(0, 1fr); }
  .hs-shell > main { padding-bottom: 0; }
  .hs-nav { position: sticky; top: 0; bottom: auto; height: 100vh; height: 100dvh; padding: 44px 0 16px; flex-direction: column; justify-content: flex-start; gap: 4px; }
  .hs-nav .item { flex: 0 0 auto; width: 100%; padding: 4px 0 8px; }
}
@media (min-width: 1200px) {
  .hs-shell:not([data-rail="collapsed"]) { grid-template-columns: var(--hs-nav-rail-expanded) minmax(0, 1fr); }
  :not([data-rail="collapsed"]) > .hs-nav { padding: 24px 12px; align-items: stretch; }
  :not([data-rail="collapsed"]) > .hs-nav .item { flex-direction: row; gap: 0; height: 56px; padding: 0; border-radius: var(--md-sys-shape-corner-full); isolation: isolate;
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-ref-typeface-plain); }
  :not([data-rail="collapsed"]) > .hs-nav .item .ic { width: 56px; height: 56px; position: static; isolation: auto; }
  :not([data-rail="collapsed"]) > .hs-nav .item .ic::before { inset: 0; transform-origin: left center; }
  :not([data-rail="collapsed"]) > .hs-nav .item .ic::after { inset: 0; }
  :not([data-rail="collapsed"]) > .hs-nav .item[aria-current="page"] { color: var(--md-sys-color-on-secondary-container); }   /* label sits inside the pill */
  :not([data-rail="collapsed"]) > .hs-nav .lb { min-width: 0; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* expanded rail may truncate; add title= */
  :not([data-rail="collapsed"]) > .hs-nav .item .badge { position: absolute; top: 50%; inset-inline: auto 16px; translate: 0 -50%; }   /* after the label */
  :not([data-rail="collapsed"]) > .hs-nav .item:has(.badge) .lb { padding-inline-end: 48px; }
  :not([data-rail="collapsed"]) > .hs-nav .rail-top { justify-items: start; padding-inline: 8px; }
  :dir(rtl) > .hs-nav .item .ic::before { transform-origin: right center; }
}
/* optional: nav bar with horizontal items at medium instead of the rail */
@media (min-width: 600px) and (max-width: 839px) {
  .hs-shell.bar-medium { grid-template-columns: minmax(0, 1fr); }
  .hs-shell.bar-medium > main { padding-bottom: calc(var(--hs-nav-bar) + env(safe-area-inset-bottom, 0px)); }
  .hs-shell.bar-medium .hs-nav { position: fixed; top: auto; bottom: 0; height: auto; min-height: calc(var(--hs-nav-bar) + env(safe-area-inset-bottom, 0px)); flex-direction: row; justify-content: center; align-items: center; padding: 0 0 env(safe-area-inset-bottom, 0px); }
  .hs-shell.bar-medium .hs-nav .item { flex: 0 0 auto; width: auto; flex-direction: row; padding: 0 4px; }
  .hs-shell.bar-medium .hs-nav .item .ic { width: auto; height: 40px; padding-inline: 16px; gap: 4px; display: flex; align-items: center; }
}

/* ---------- app bar (small; .center; .medium / .large flexible; .sub subtitle) ---------- */
.hs-appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; min-height: 64px; display: flex; align-items: center; gap: 0;
  padding-inline: 4px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
  transition: background-color var(--md-motion-default-effects), box-shadow var(--md-motion-default-effects); }
.hs-appbar > :not(.title, .ibtn) { margin-inline: 4px; }
.hs-appbar[data-scrolled] { background: var(--md-sys-color-surface-container); }
.hs-appbar .title { flex: 1; min-width: 0; padding-inline: 4px; font: var(--md-sys-typescale-title-large-weight) var(--md-sys-typescale-title-large-size)/var(--md-sys-typescale-title-large-line-height) var(--md-sys-typescale-title-large-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-appbar > .title:first-child { padding-inline-start: 12px; }   /* title at 16 when no leading button */
.hs-appbar .sub { display: block; font: var(--md-sys-typescale-label-medium-weight) var(--md-sys-typescale-label-medium-size)/var(--md-sys-typescale-label-medium-line-height) var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
.hs-appbar > .ibtn:not(:first-child) { color: var(--md-sys-color-on-surface-variant); }
.hs-appbar > .ibtn:first-child { color: var(--md-sys-color-on-surface); }
.hs-appbar.center .title { text-align: center; }
.hs-appbar.medium, .hs-appbar.large { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "lead . trail" "title title title"; align-items: center; padding-bottom: 12px; }
.hs-appbar.medium > .lead, .hs-appbar.large > .lead { grid-area: lead; } .hs-appbar.medium > .trail, .hs-appbar.large > .trail { grid-area: trail; display: flex; }
.hs-appbar.medium { min-height: 112px; } .hs-appbar.large { min-height: 120px; }
.hs-appbar.medium .title, .hs-appbar.large .title { grid-area: title; padding-inline: 12px; white-space: normal; overflow: visible; text-overflow: clip; }   /* wraps (aim for ≤ 2 lines), never truncates */
.hs-appbar.medium .title { font: var(--md-sys-typescale-headline-medium-weight) var(--md-sys-typescale-headline-medium-size)/var(--md-sys-typescale-headline-medium-line-height) var(--md-sys-typescale-headline-medium-font); }
.hs-appbar.large .title  { font: var(--md-sys-typescale-display-small-weight) var(--md-sys-typescale-display-small-size)/var(--md-sys-typescale-display-small-line-height) var(--md-sys-typescale-display-small-font); }
.hs-appbar.medium .sub { font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-ref-typeface-plain); }
.hs-appbar.large .sub  { font: var(--md-sys-typescale-title-medium-weight) var(--md-sys-typescale-title-medium-size)/var(--md-sys-typescale-title-medium-line-height) var(--md-ref-typeface-plain); }

/* =====================================================================
   5. STATE LAYER + SHARED INTERACTION RULES
   ===================================================================== */
.hs-sl { position: relative; isolation: isolate; }
.hs-sl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; pointer-events: none; z-index: -1;
  transition: opacity var(--md-motion-fast-effects); }
.hs-sl:focus-visible::after { opacity: var(--md-sys-state-focus-state-layer-opacity); }
.hs-sl:active::after { opacity: var(--md-sys-state-pressed-state-layer-opacity); }

.switch:is([aria-checked="true"], :checked):is(:disabled, [aria-disabled="true"])::before { background: var(--md-sys-color-surface); }
.switch:is(:disabled, [aria-disabled="true"])::after { opacity: 0 !important; }
.switch:is(:disabled, [aria-disabled="true"]):active { --hd: 16px; }
.switch:is([aria-checked="true"], :checked):is(:disabled, [aria-disabled="true"]):active { --hd: 24px; }
@media (hover: hover) and (pointer: fine) {
  .switch:not(:disabled, [aria-disabled="true"]):hover::after { opacity: var(--md-sys-state-hover-state-layer-opacity); }
  .switch:not(:disabled, [aria-disabled="true"]):hover::before { background: var(--md-sys-color-on-surface-variant); }
  .switch:is([aria-checked="true"], :checked):not(:disabled, [aria-disabled="true"]):hover::before { background: var(--md-sys-color-primary-container); }
}

/* ---------- slider (Expressive; native range; XS default, .s .m .l .xl; set --p with JS) ---------- */
.slider { --p: 50%; --tk: 16px; --hd: 44px; --tr: 8px; --gap: 6px;
  --act: var(--md-sys-color-primary); --inact: var(--md-sys-color-secondary-container); --stop: var(--md-sys-color-on-secondary-container);
  --track: radial-gradient(circle at calc(100% - var(--tk) / 2) 50%, var(--stop) 0 2px, transparent 2.5px),
           linear-gradient(to right, var(--act) 0 calc(var(--p) - var(--gap) - 2px), transparent 0 calc(var(--p) + var(--gap) + 2px), var(--inact) 0);
  appearance: none; -webkit-appearance: none; width: 100%; height: var(--hd); margin: 0; background: transparent; cursor: pointer; display: block; }
.slider:dir(rtl) { --track: radial-gradient(circle at calc(var(--tk) / 2) 50%, var(--stop) 0 2px, transparent 2.5px),
           linear-gradient(to left, var(--act) 0 calc(var(--p) - var(--gap) - 2px), transparent 0 calc(var(--p) + var(--gap) + 2px), var(--inact) 0); }
.slider::-webkit-slider-runnable-track { height: var(--tk); border-radius: var(--tr); background: var(--track); }
.slider::-moz-range-track { height: var(--tk); border-radius: var(--tr); background: var(--track); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 4px; height: var(--hd); margin-top: calc((var(--tk) - var(--hd)) / 2); border: 0; border-radius: 2px; background: var(--act); transition: width var(--hs-fast); }
.slider::-moz-range-thumb { width: 4px; height: var(--hd); border: 0; border-radius: 2px; background: var(--act); transition: width var(--hs-fast); }
.slider:active::-webkit-slider-thumb { width: 2px; }
.slider:active::-moz-range-thumb { width: 2px; }
.slider:focus-visible { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
.slider:focus-visible::-moz-range-thumb { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
.slider:disabled { cursor: not-allowed; --act: var(--hs-dis-fg); --inact: var(--hs-dis-line); --stop: var(--hs-dis-fg); }
.slider.s { --tk: 24px; }
.slider.m { --tk: 40px; --hd: 52px; --tr: 12px; }
.slider.l { --tk: 56px; --hd: 68px; --tr: 16px; }
.slider.xl { --tk: 96px; --hd: 108px; --tr: 28px; }
/* value indicator: <div class="slider-field"><input class="slider"><output class="val"></output></div> */
.slider-field { position: relative; display: grid; }
.slider-field > .val { position: absolute; bottom: calc(100% + 4px); left: var(--p, 50%); translate: -50% 0; min-width: 48px; height: 44px; padding-inline: 16px; display: grid; place-items: center;
  border-radius: var(--md-sys-shape-corner-full); background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface); pointer-events: none;
  font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/1 var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity var(--hs-fx); }
.slider-field:dir(rtl) > .val { left: auto; right: var(--p, 50%); translate: 50% 0; }
.slider-field:has(> .slider:active, > .slider:focus-visible) > .val { opacity: 1; }

/* =====================================================================
   9. NAVIGATION + ACTIONS: tabs, search, toolbar
   ===================================================================== */
/* ---------- tabs (primary / .secondary; fixed or .scroll; sliding indicator) ----------
   <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected><span class="in">Label</span></button>…
   JS adds <span class="ind"> and sets --x / --w; without it each selected tab draws its own indicator. */
.tabs { position: relative; display: flex; overflow-x: auto; scrollbar-width: none; background: var(--md-sys-color-surface); box-shadow: inset 0 -1px 0 var(--md-sys-color-outline-variant); }
.tabs::-webkit-scrollbar { display: none; }
.tabs.scroll { padding-inline-start: 52px; }
.tab { position: relative; isolation: isolate; flex: 1 1 0; min-width: 90px; min-height: 48px; padding: 0 16px; display: flex; justify-content: center; align-items: stretch;
  border: 0; background: none; cursor: pointer; text-decoration: none; color: var(--md-sys-color-on-surface-variant);
  font: var(--md-sys-typescale-title-small-weight) var(--md-sys-typescale-title-small-size)/var(--md-sys-typescale-title-small-line-height) var(--md-ref-typeface-plain);
  letter-spacing: var(--md-sys-typescale-title-small-tracking); white-space: nowrap; transition: color var(--hs-fx); }
.tabs.scroll .tab { flex: 0 0 auto; }
.tab:focus-visible { outline-offset: -3px; }
.tab > :is(.in, .lb) { position: relative; display: inline-flex; align-items: center; gap: 8px; padding-inline: 2px; }
.tab.stack, .tab.stacked { min-height: 64px; }
.tab:is(.stack, .stacked) > :is(.in, .lb) { flex-direction: column; justify-content: center; gap: 2px; }
.tab::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; z-index: -1; pointer-events: none; transition: opacity var(--hs-fx); }
.tab:focus-visible { color: var(--md-sys-color-on-surface); }
.tab:focus-visible::after { opacity: var(--md-sys-state-focus-state-layer-opacity); }
.tab:active::after { opacity: var(--md-sys-state-pressed-state-layer-opacity); }
.tab[aria-selected="true"] { color: var(--md-sys-color-primary); }
.tab .badge { margin-inline-start: 4px; }
/* static indicators (no JS) */
.tabs:not(:has(> .ind)) .tab[aria-selected="true"] > :is(.in, .lb)::after { content: ""; position: absolute; inset-inline: 2px; bottom: 0; min-width: 24px; height: 3px;
  border-radius: 3px 3px 0 0; background: var(--md-sys-color-primary); }
.tabs.secondary .tab[aria-selected="true"] { color: var(--md-sys-color-on-surface); }
.tabs.secondary:not(:has(> .ind)) .tab[aria-selected="true"] > :is(.in, .lb)::after { content: none; }
.tabs.secondary:not(:has(> .ind)) .tab[aria-selected="true"]::before { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 2px; background: var(--md-sys-color-primary); }
/* sliding indicator (shared position, not a fade) */
.tabs > .ind { position: absolute; left: 0; bottom: 0; z-index: 1; width: var(--w, 0px); height: 3px; translate: var(--x, 0px) 0; pointer-events: none;
  border-radius: 3px 3px 0 0; background: var(--md-sys-color-primary); transition: translate var(--hs-fast), width var(--hs-fast); }
.tabs.secondary > .ind { height: 2px; border-radius: 0; }
.tab-panels { overflow: hidden; display: grid; }
.tab-panels > [role="tabpanel"] { grid-area: 1 / 1; min-width: 0; }
@media (hover: hover) and (pointer: fine) {
  .tab:hover { color: var(--md-sys-color-on-surface); }
  .tab[aria-selected="true"]:hover { color: var(--md-sys-color-primary); }
  .tabs.secondary .tab[aria-selected="true"]:hover { color: var(--md-sys-color-on-surface); }
  .tab:hover::after { opacity: var(--md-sys-state-hover-state-layer-opacity); }
}

/* ---------- search (contained: filled bar, full round; docked results; full-screen on compact with .open) ---------- */
.search-wrap { min-width: 0; padding-inline: 24px; transition: padding var(--hs-default); }
.search-wrap:focus-within { padding-inline: 12px; }
.search { display: flex; align-items: center; gap: 4px; min-height: 56px; max-width: 720px; margin-inline: auto; padding-inline: 4px; border-radius: var(--md-sys-shape-corner-full);
  background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); transition: box-shadow var(--hs-fx); }
.search:focus-within { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }
.search > .ms:first-child { width: 48px; max-width: 48px; text-align: center; color: var(--md-sys-color-on-surface); }   /* non-functional search icon */
.search > .ibtn:first-child { color: var(--md-sys-color-on-surface); }
.search input { flex: 1; min-width: 0; width: 0; height: 100%; min-height: 48px; padding: 0; border: 0; outline: none; background: none; color: var(--md-sys-color-on-surface);
  font: var(--md-sys-typescale-body-large-weight) var(--md-sys-typescale-body-large-size)/var(--md-sys-typescale-body-large-line-height) var(--md-ref-typeface-plain); }
.search input::placeholder { color: var(--md-sys-color-on-surface-variant); opacity: 1; }
.search input::-webkit-search-cancel-button { display: none; }
.search .avatar { width: 30px; height: 30px; border-radius: 50%; margin-inline: 9px; display: grid; place-items: center; flex: 0 0 auto;
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); font: 600 0.75rem/1 var(--md-ref-typeface-plain); }
.search-view { max-width: 720px; margin: 8px auto 0; min-height: 120px; max-height: 66dvh; overflow: auto; padding: 8px; border-radius: var(--md-sys-shape-corner-extra-large);
  background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); display: grid; gap: 8px; align-content: start; }
.search-view .lbl { padding: 8px 12px 0; font: var(--md-sys-typescale-label-medium-weight) var(--md-sys-typescale-label-medium-size)/var(--md-sys-typescale-label-medium-line-height) var(--md-ref-typeface-plain); color: var(--md-sys-color-on-surface-variant); }
.search-view .li { background: var(--md-sys-color-surface-container-high); }
.search-view mark { background: none; color: inherit; font-weight: 700; }
.search-view .none { padding: 24px 16px; text-align: center; color: var(--md-sys-color-on-surface-variant); }
@media (max-width: 599px) { .search-view.open { position: fixed; inset: 0; z-index: 52; margin: 0; max-width: none; max-height: none; border-radius: 0; background: var(--md-sys-color-surface-container-low); } }

/* ---------- toolbars (docked: bottom, full width; floating: pill; standard / .vibrant) ---------- */
.toolbar, .hs-toolbar { display: flex; align-items: center; min-height: 64px; gap: 4px; color: var(--md-sys-color-on-surface-variant); background: var(--md-sys-color-surface-container); }
.toolbar.docked { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; min-height: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 0 16px env(safe-area-inset-bottom, 0px); justify-content: space-evenly; }
@media (min-width: 600px) { .toolbar.docked { justify-content: center; gap: 32px; } }
.toolbar.floating { position: fixed; z-index: 30; left: 50%; translate: -50% 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); width: max-content;
  padding-inline: 8px; border-radius: var(--md-sys-shape-corner-full); box-shadow: var(--md-sys-elevation-level1); }
.toolbar.floating.vertical { flex-direction: column; width: 64px; padding-block: 8px; padding-inline: 0; left: auto; inset-inline-end: 24px; top: 50%; bottom: auto; translate: 0 -50%; }
.toolbar.toolbar.toolbar.static { position: static; translate: none; }
.toolbar.vibrant { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.toolbar.vibrant .ibtn:not(.filled, .tonal) { color: var(--md-sys-color-on-primary-container); }
.toolbar.vibrant .ibtn.toggle[aria-pressed="true"] { background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); }
.toolbar .ibtn.toggle.tonal[aria-pressed="false"] { background: transparent; color: inherit; }
.toolbar .ibtn.toggle.tonal[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.toolbar.floating .ibtn.square { --r: var(--md-sys-shape-corner-full); }   /* no square buttons in floating toolbars */
.toolbar .hs-div.v { margin-block: 16px; }
.hs-shell:has(> .toolbar.docked) .hs-nav, .hs-shell:has(> main > .toolbar.docked) .hs-nav { display: none; }   /* never with a nav bar */

/* =====================================================================
   10. FEEDBACK: badges, status, progress, loaders, skeleton
   ===================================================================== */
.badge { display: inline-grid; justify-self: start; place-items: center; min-width: 16px; min-height: 16px; padding: 0 4px; border-radius: var(--md-sys-shape-corner-full);
  background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); font: 500 0.6875rem/1rem var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
.badge.dot { min-width: 6px; min-height: 6px; width: 6px; height: 6px; padding: 0; }
.status { display: inline-flex; justify-self: start; align-items: center; gap: 6px; min-height: 24px; padding: 4px 10px; border-radius: var(--md-sys-shape-corner-full); white-space: nowrap;
  font: var(--md-sys-typescale-label-medium-weight) var(--md-sys-typescale-label-medium-size)/var(--md-sys-typescale-label-medium-line-height) var(--md-ref-typeface-plain);
  background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.status.good { background: var(--hs-good-container); color: var(--hs-on-good-container); }
.status.warn { background: var(--hs-warn-container); color: var(--hs-on-warn-container); }
.status.bad  { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
.status.info { background: var(--hs-info-container); color: var(--hs-on-info-container); }

/* ---------- linear progress (track 4, gap 4, stop dot at the end, mirrored in RTL) ----------
   role="progressbar" aria-valuenow …; set --p (0–1). At 0 add .zero (or aria-valuenow="0") to hide the dot-sized indicator. */
.progress { --p: 0; position: relative; height: 4px; margin-inline: 4px; border-radius: 2px; overflow: hidden; }
.progress::before { content: ""; position: absolute; inset: 0; inset-inline-start: auto; width: calc((1 - var(--p)) * 100% - 4px); border-radius: 2px;
  background: radial-gradient(circle at calc(100% - 2px) 50%, var(--md-sys-color-primary) 0 2px, transparent 2.5px), var(--md-sys-color-secondary-container);
  transition: width var(--hs-slow); }
.progress:dir(rtl)::before { background: radial-gradient(circle at 2px 50%, var(--md-sys-color-primary) 0 2px, transparent 2.5px), var(--md-sys-color-secondary-container); }
.progress::after { content: ""; position: absolute; inset: 0; inset-inline-end: auto; width: max(4px, calc(var(--p) * 100%)); border-radius: 2px; background: var(--md-sys-color-primary); transition: width var(--hs-slow); }
.progress:is(.zero, [aria-valuenow="0"])::after { width: 0; }
.progress.ind::before { width: 100%; background: var(--md-sys-color-secondary-container); }   /* no stop when indeterminate */
.progress.ind::after { width: var(--hs-ind-w); animation: var(--hs-anim-ind); }
.progress.ind:dir(rtl)::after { animation-direction: reverse; }
@keyframes hs-ind { from { translate: -100% 0; } to { translate: 260% 0; } }

/* ---------- circular progress (40 default, 4 stroke, 4 gap; .indeterminate) ----------
   <svg class="cprog" viewBox="0 0 40 40" role="progressbar"><circle class="trk" cx="20" cy="20" r="18" pathLength="100"/><circle class="ind" cx="20" cy="20" r="18" pathLength="100"/></svg> */
.cprog { --p: 0; --s: 40px; --g: 7; width: var(--s); height: var(--s); rotate: -90deg; flex: 0 0 auto; overflow: visible; }
.cprog circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.cprog .trk { stroke: var(--md-sys-color-secondary-container);
  stroke-dasharray: max(0, calc(100 - var(--p) * 100 - var(--g) * 2)) 100; stroke-dashoffset: calc(var(--p) * -100 - var(--g)); transition: stroke-dasharray var(--hs-slow), stroke-dashoffset var(--hs-slow); }
.cprog .ind { stroke: var(--md-sys-color-primary); stroke-dasharray: calc(var(--p) * 100) 100; transition: stroke-dasharray var(--hs-slow); }
.cprog:is(.indeterminate, .ind-anim) { animation: var(--hs-anim-cprog); }
.cprog:is(.indeterminate, .ind-anim) .trk { display: none; }
.cprog:is(.indeterminate, .ind-anim) .ind { stroke-dasharray: 30 100; animation: var(--hs-anim-arc); }
.cprog.s24 { --s: 24px; --g: 10; } .cprog.s48 { --s: 48px; --g: 6; }
.btn .cprog, .ibtn .cprog { --s: 20px; } .btn .cprog .trk, .ibtn .cprog .trk { display: none; } .btn .cprog .ind, .ibtn .cprog .ind { stroke: currentColor; }   /* in buttons: label colour, no track */
@keyframes hs-cspin { from { rotate: -90deg; } to { rotate: 270deg; } }
@keyframes hs-arc { 0% { stroke-dasharray: 4 100; stroke-dashoffset: 0; } 50% { stroke-dasharray: 70 100; stroke-dashoffset: -12; } 100% { stroke-dasharray: 4 100; stroke-dashoffset: -96; } }

/* ---------- Expressive loading indicator: shape morph in a 48 container (24–240 via --s) ---------- */
.hs-loader { --s: 48px; width: var(--s); height: var(--s); display: grid; place-items: center; flex: 0 0 auto; }
.hs-loader::before { content: ""; width: calc(var(--s) * 38 / 48); height: calc(var(--s) * 38 / 48); border-radius: 50%; background: var(--md-sys-color-primary); animation: var(--hs-anim-loader); }
.hs-loader.contained { border-radius: 50%; background: var(--md-sys-color-primary-container); }
.hs-loader.contained::before { width: calc(var(--s) * 30 / 48); height: calc(var(--s) * 30 / 48); background: var(--md-sys-color-on-primary-container); }
@keyframes hs-morph { 0%,100% { border-radius: 50%; } 14% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; } 28% { border-radius: 12px; } 42% { border-radius: 50% 50% 12px 12px; }
  57% { border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%; } 71% { border-radius: 50% 12px; } 85% { border-radius: 24px 50%; } }
@keyframes hs-spin { to { rotate: 360deg; } }
@keyframes hs-fadepulse { 50% { opacity: .45; } }

/* ---------- skeleton: a pulse (set --i in document order so it travels top-left → bottom-right) ---------- */
.hs-skel { position: relative; overflow: hidden; border-radius: var(--md-sys-shape-corner-small); background: var(--md-sys-color-surface-container-highest);
  animation: var(--hs-anim-skel); animation-delay: calc(var(--i, 0) * 80ms); }
.hs-skel::after { content: none; }
@keyframes hs-pulse { 50% { opacity: .55; } }
.hs-fade-in { animation: hs-fade-in var(--md-motion-fast-effects) both; }   /* content arriving after a skeleton */
@keyframes hs-fade-in { from { opacity: 0; } }

/* =====================================================================
   11. OVERLAYS: scrim, dialog, full-screen dialog, bottom sheet, side sheet, snackbar, menu, tooltip
   Prefer native <dialog> + showModal() (inert background, focus containment, Esc) and the popover attribute.
   ===================================================================== */
.hs-scrim { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--md-sys-color-scrim) 32%, transparent); }
dialog:is(.dialog, .bsheet, .ssheet) { border: 0; color: var(--md-sys-color-on-surface); max-width: none; max-height: none; }
dialog:is(.dialog, .bsheet, .ssheet)::backdrop { background: color-mix(in srgb, var(--md-sys-color-scrim, #000) 32%, transparent); opacity: 1;
  transition: opacity var(--hs-exit-dur) linear, display var(--hs-exit-dur) allow-discrete, overlay var(--hs-exit-dur) allow-discrete; }
dialog:is(.dialog, .bsheet, .ssheet):not([open])::backdrop { opacity: 0; }
@starting-style { dialog:is(.dialog, .bsheet, .ssheet)[open]::backdrop { opacity: 0; } }
dialog.hs-noscrim::backdrop { background: transparent; }   /* large screens: scrim optional */
body:has(dialog[open]:modal) { overflow: hidden; }

/* ---------- basic dialog: pinned headline + actions, only .body scrolls; 24 before actions ---------- */
.dialog { position: fixed; z-index: 51; left: 50%; top: 50%; translate: -50% -50%; width: min(560px, calc(100vw - 32px)); min-width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  margin: 0; padding: var(--hs-space-5); border-radius: var(--md-sys-shape-corner-extra-large); background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface);
  box-shadow: var(--md-sys-elevation-level3); display: flex; flex-direction: column; gap: var(--hs-space-4); overflow: hidden; }
dialog.dialog { inset: 50% auto auto 50%; }
dialog.dialog:not([open]) { display: none; }
.dialog > * { flex: 0 0 auto; }
.dialog > .ic { align-self: center; color: var(--md-sys-color-secondary); font-size: 24px; }
.dialog .head { color: var(--md-sys-color-on-surface); font: var(--md-sys-typescale-headline-small-weight) var(--md-sys-typescale-headline-small-size)/var(--md-sys-typescale-headline-small-line-height) var(--md-sys-typescale-headline-small-font); }
.dialog:has(> .ic) .head { text-align: center; }
.dialog > .body, .dialog > p { color: var(--md-sys-color-on-surface-variant);
  font: var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-ref-typeface-plain); }
.dialog > .body { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; gap: var(--hs-space-4); align-content: start; }
.dialog > .body.divided { margin-inline: calc(var(--hs-space-5) * -1); padding: var(--hs-space-4) var(--hs-space-5); border-block: 1px solid var(--md-sys-color-outline-variant); max-inline-size: none; }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 8px; }   /* 16 gap + 8 = 24 */
.dialog .acts.stacked { flex-direction: column-reverse; align-items: flex-end; }
/* full-screen dialog on compact; becomes a basic dialog at medium+ (.bar hidden, .head + .acts shown) */
.dialog > .bar { display: none; }
@media (max-width: 599px) {
  .dialog.fs { inset: 0; translate: none; width: 100%; max-width: none; height: 100dvh; max-height: none; min-width: 0; padding: 0; gap: 0; border-radius: 0; box-shadow: none; }

<style>
  html, body { background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); }
  body { margin: 0; min-height: 100dvh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
  .hs-appbar { position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top, 0px); }
  .hs-appbar .title { min-width: 0; }

  /* capture */
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .shot { position: relative; aspect-ratio: 1; border-radius: var(--md-sys-shape-corner-small); overflow: hidden; background: var(--md-sys-color-surface-container-high); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity var(--hs-fx); }
  .shot .ibtn { position: absolute; top: 2px; right: 2px; background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }
  .shot .tick { position: absolute; inset: 0; display: grid; place-items: center; color: var(--hs-on-good-container); opacity: 0; }
  .shot .tick .ms { width: 40px; height: 40px; display: grid; place-items: center; overflow: hidden; background: var(--hs-good-container); border-radius: var(--md-sys-shape-corner-full); }
  .shots.sent .shot img { opacity: .4; }
  .shots.sent .shot .tick { opacity: 1; }
  .shots.sent .shot .ibtn { display: none; }
  .empty-shot { grid-column: 1 / -1; min-height: 140px; display: grid; place-items: center; gap: 8px; text-align: center; border: 1px dashed var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-medium); color: var(--md-sys-color-on-surface-variant); background: transparent; font: inherit; cursor: pointer; }
  .empty-shot .ms { font-size: 40px; --ms-opsz: 40; }
  /* ── scheme B: colour by content role ── */
  .hs-appbar .title { color: var(--md-sys-color-primary); }
  .cap { background: var(--md-sys-color-surface-container-low); box-shadow: var(--md-sys-elevation-level1); }
  .shots .empty-shot { min-height: 240px; border: 0; border-radius: var(--md-sys-shape-corner-extra-large); background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); transition: scale var(--hs-fast); }
  .shots .empty-shot:active { scale: .98; }
  .shots .empty-shot .ms { font-size: 56px; --ms-opsz: 48; }
  .shots .empty-shot .sub { color: inherit; opacity: .8; }
  .add-more { aspect-ratio: 1; border: 0; border-radius: var(--md-sys-shape-corner-small); background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); display: grid; place-items: center; align-content: center; gap: 4px; cursor: pointer; font: inherit; }
  .shots.sent .add-more { visibility: hidden; }
  .lib { justify-self: center; }
  .hints-toggle { justify-self: start; }
  .hints-toggle .chev { transition: rotate var(--hs-fast); }
  .hints-toggle[aria-expanded="true"] .chev { rotate: 180deg; }
  #recent .li { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  #recent .li .main span { color: inherit; }
  #capH, #recH { color: var(--md-sys-color-primary); }
  .band { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .band .tile { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--md-sys-shape-corner-large); padding: 12px; display: grid; gap: 2px; box-shadow: var(--md-sys-elevation-level1); }
  .band .tile:nth-child(1) { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
  .band .tile:nth-child(2) { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .band .tile:nth-child(3) { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
  .band .fig { font-variant-numeric: tabular-nums; }
  .band .wm { position: absolute; right: -8px; bottom: -12px; font-size: 64px; --ms-opsz: 48; opacity: .14; z-index: -1; }
  #hintsBox { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); border-radius: var(--md-sys-shape-corner-large); padding: 12px; }
  #hintsBox .muted { color: inherit; }
  #hintsBox .chip:not([aria-pressed="true"]) { color: inherit; border-color: color-mix(in srgb, currentColor 55%, transparent); }
  #hintsBox .tf label, #hintsBox .tf .pre { color: inherit; }
  #hintsBox .tf .field { background: var(--md-sys-color-surface-container-lowest); }
  .hints-toggle.set { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
  /* ── burst camera ── */
  #cam { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-rows: 1fr auto; background: var(--md-sys-color-scrim); color: var(--md-sys-color-inverse-on-surface); }
  #cam video { width: 100%; height: 100%; object-fit: cover; min-height: 0; }
  #cam .flash { position: absolute; inset: 0; background: var(--md-sys-color-inverse-on-surface); opacity: 0; pointer-events: none; }
  #cam .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--md-sys-color-inverse-surface); }
  #cam .tray { display: flex; gap: 6px; overflow-x: auto; min-width: 0; }
  #cam .tray img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--md-sys-shape-corner-extra-small); flex: none; }
  #cam .shutter { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--md-sys-color-inverse-on-surface); background: var(--md-sys-color-primary-container); cursor: pointer; padding: 0; transition: scale var(--hs-fast); }
  #cam .shutter:active { scale: .9; }
  #cam .right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  #cam .count { font-variant-numeric: tabular-nums; }
  #cam .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface); }
  .price { max-width: 200px; }
  #send { width: 100%; }

  /* recent */
  .li .thumb { width: 48px; height: 48px; border-radius: var(--md-sys-shape-corner-extra-small); object-fit: cover; background: var(--md-sys-color-surface-container-high); flex: none; }
  .li .main b, .li .main span { overflow-wrap: anywhere; white-space: normal; overflow: visible; text-overflow: clip; }
  .li .trail { display: flex; align-items: center; gap: 4px; flex: none; }
  .recent-empty { color: var(--md-sys-color-on-surface-variant); padding: 8px 0; }

  /* sync edge: connection + queue state (ambient). Same geometry for every state; only colour and strength change. */
  #edge { position: fixed; inset: 0; pointer-events: none; z-index: 40; transition: box-shadow var(--hs-fx);
          box-shadow: inset 0 0 34px 12px transparent; }
  #edge[data-s="online"]  { box-shadow: inset 0 0 34px 12px color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent); }
  #edge[data-s="working"] { box-shadow: inset 0 0 34px 12px color-mix(in srgb, var(--hs-warn) 60%, transparent); }
  #edge[data-s="offline"] { box-shadow: inset 0 0 34px 12px color-mix(in srgb, var(--md-sys-color-outline) 75%, transparent); }
  /* halo: this capture is safe on the phone (fires on the durable local save, never on server ack) */
  #halo { position: fixed; inset: 0; pointer-events: none; z-index: 41; opacity: 0;
          background: radial-gradient(ellipse at center, transparent 45%, color-mix(in srgb, var(--hs-good) 70%, transparent) 100%); }
</style>
</head>
<body>
<div id="edge" aria-hidden="true"></div>
<div id="halo" aria-hidden="true"></div>

<header class="hs-appbar" id="bar">
  <h1 class="title">Lister drop<span class="sub">Photos and a note. The agent does the rest</span></h1>
  <span class="status" id="syncPill" role="status" aria-live="polite">Checking</span>
</header>

<main class="wrap">
  <div class="band" role="list" aria-label="Your drops">
    <div class="tile" role="listitem"><span class="ms wm" aria-hidden="true">photo_camera</span><span class="t-eyebrow">Today</span><span class="t-headline-s fig" id="figToday">0</span></div>
    <div class="tile" role="listitem"><span class="ms wm" aria-hidden="true">cloud_done</span><span class="t-eyebrow">Sending</span><span class="t-headline-s fig" id="figSending">0</span></div>
    <div class="tile" role="listitem"><span class="ms wm" aria-hidden="true">schedule</span><span class="t-eyebrow">This week</span><span class="t-headline-s fig" id="figWeek">0</span></div>
  </div>
  <section class="card stack cap" aria-labelledby="capH">
    <h2 class="t-title-m" id="capH">New item</h2>
    <div class="shots" id="shots"></div>
    <button class="btn text lib" id="libBtn"><span class="ms" aria-hidden="true">photo_library</span>Choose from library</button>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="libIn" accept="image/*" multiple hidden>

    <div class="tf filled">
      <label for="note">Note</label>
      <textarea id="note" rows="3" maxlength="4000" placeholder="What it is, condition, anything you know"></textarea>
      <span class="sup">Tap the keyboard mic to dictate</span>
    </div>

    <button class="btn text hints-toggle" id="hintsBtn" aria-expanded="false" aria-controls="hintsBox"><span class="ms" aria-hidden="true">tune</span><span id="hintsLabel">Add hints</span><span class="ms chev" aria-hidden="true">expand_more</span></button>
    <div class="stack" style="gap:8px" id="hintsBox" hidden>
      <span class="t-body-s muted">Optional. Skip them and the agent works it out</span>
      <div class="chip-set" role="group" aria-label="Hints">
        <button class="chip" aria-pressed="false" data-hint="deep">Deep dive</button>
        <button class="chip" aria-pressed="false" data-hint="clothing">Clothing</button>
        <button class="chip" aria-pressed="false" data-hint="collectionOnly">Collection only</button>
        <button class="chip" aria-pressed="false" data-hint="canPost">Can post</button>
      </div>
      <div class="tf price"><label for="price">Price in mind</label><div class="field"><span class="pre" aria-hidden="true">£</span><input id="price" inputmode="decimal" autocomplete="off" placeholder="Optional"></div></div>
    </div>

    <button class="btn m" id="send" disabled>Send item</button>
    <span class="t-body-s muted" id="sendNote" aria-live="polite"></span>
  </section>

  <section class="stack" aria-labelledby="recH">
    <h2 class="t-title-m" id="recH">Recent</h2>
    <div class="list" id="recent"></div>
  </section>
</main>

<div id="cam" hidden role="dialog" aria-modal="true" aria-label="Camera">
  <video id="camVid" playsinline muted autoplay></video>
  <div class="flash" id="camFlash" aria-hidden="true"></div>
  <button class="ibtn close" id="camClose" aria-label="Close camera"><span class="ms">close</span></button>
  <div class="bar">
    <div class="tray" id="camTray" aria-label="Photos taken"></div>
    <button class="shutter" id="shutter" aria-label="Take photo"></button>
    <div class="right"><span class="t-label-l count" id="camCount" aria-live="polite"></span><button class="btn" id="camDone">Done</button></div>
  </div>
</div>

<script>/* House Style motion kit v0.3 — Material 3 (Expressive) motion, M3 transition patterns, small accessible helpers, live theming.

    if (HSk && prev && prev !== state) HSk.status(pill, state === 'sent' ? 'done' : state === 'stuck' ? 'failed' : 'working');
    var r = row.querySelector('[data-act="retry"]'), x = row.querySelector('[data-act="discard"]');
    if (r) r.onclick = function () { it.stuck = false; it.fails = 0; save(it).then(function () { renderRow(it); flush(true); }); };
    if (x) x.onclick = function () {
      if (!confirm('Discard this item? Its photos will be removed from this phone')) return;
      Promise.all(it.names.map(function (n) { return dropBlob(it.itemId + '/' + n); }))
        .then(function () { return S.dbOk ? delItem(it.itemId) : delete MEM.items[it.itemId]; })
        .then(function () { return renderRecent(); });
    };
  }
  function markRow(it, s) { renderRow(it, s); }
  function renderRecent(newId) {
    return allItems().then(function (items) {
      items.sort(function (a, b) { return a.capturedAt < b.capturedAt ? 1 : -1; });
      // keep the phone light: forget sent items beyond the latest 15
      var old = items.filter(function (i) { return i.committed; }).slice(15);
      old.forEach(function (i) { if (S.dbOk) delItem(i.itemId); else delete MEM.items[i.itemId]; });
      items = items.filter(function (i) { return old.indexOf(i) < 0; });
      var list = $('recent');
      list.innerHTML = items.length ? '' : '<p class="recent-empty t-body-m">Nothing sent yet</p>';
      items.forEach(function (it) {
        var row = document.createElement('div');
        row.className = 'li'; row.dataset.item = it.itemId;
        list.appendChild(row);
        renderRow(it);
      });
      countQueued(items);
      if (HSk && newId) { var nr = list.querySelector('[data-item="' + newId + '"]'); if (nr) HSk.enter([nr]); }
    });
  }

  // ── installed app: keep storage, open offline, and (Android) finish uploads after close ──
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  var SWOK = CFG.host === 'static' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  if (SWOK) navigator.serviceWorker.register('sw.js').then(function () {
    // hand the service worker the upload address so it can finish the queue on its own
    navigator.serviceWorker.ready.then(function (r) { if (r.active) r.active.postMessage({ cfg: { api: CFG.api, key: CFG.key } }); });
  }).catch(function () {});
  function askBackgroundSync() {
    if (!SWOK) return;
    navigator.serviceWorker.ready.then(function (r) { if (r.sync) r.sync.register('ld-upload').catch(function () {}); }).catch(function () {});
  }

  // ── boot: capture must work even if storage or network do not ──
  if (HSk) { try { HSk.appbar($('bar')); HSk.press(document.querySelectorAll('.btn, .chip, .ibtn')); } catch (e) {} }
  renderShots();
  openDB().then(function (d) { S.db = d; }).catch(function () { S.dbOk = false; $('sendNote').textContent = 'This phone is blocking offline storage, so items send straight away'; })
    .then(function () { return renderRecent(); })
    .then(function () { return probe(); })
    .then(function () { flush(true); });
  addEventListener('online', function () { probe().then(function (ok) { if (ok) flush(true); }); });
  addEventListener('offline', function () { setReach('offline'); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') flush(true); });
  window.onbeforeunload = function () { return S.busy ? 'Photos are still saving' : undefined; };
})();
</script>
</body>
</html>
